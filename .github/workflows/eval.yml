name: eval-scoring-tom

# Gate de qualidade do scoring de tom. Roda a suíte de testes e o eval harness
# (verdade = Selic realizada) a cada push/PR. O run_eval sai com exit 1 se a
# qualidade do ensemble regride abaixo dos thresholds — bloqueando o merge.
# Tudo offline: usa os scores já em cache, sem chave de LLM.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências (núcleo, sem LLM)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "pydantic>=2.6" numpy pandas httpx pytest

      - name: Testes (API + eval, offline)
        working-directory: src
        run: pytest -q

      - name: Gate de qualidade do scoring de tom
        working-directory: src
        run: python -m eval.run_eval
